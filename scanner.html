<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Scanner QR — Vérification Matériel V20</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
:root{--red:#e50914;--navy:#06172b;--panel:#0d2745;--white:#fff;--muted:#b9cbe0}
*{box-sizing:border-box}body{margin:0;background:var(--navy);color:#fff;font-family:system-ui,Arial,sans-serif;min-height:100vh}.wrap{width:min(1080px,100%);margin:auto;padding:24px}.title{font-size:42px;font-weight:950;margin:10px 0 22px;text-align:center}.hint{font-size:27px;color:var(--muted);text-align:center;line-height:1.4;margin-bottom:18px}.panel{background:var(--panel);border:2px solid #214467;border-radius:30px;padding:22px}#reader{width:100%}#reader video{width:100%!important;height:auto!important;max-height:70vh;object-fit:cover;border-radius:22px}.status{font-size:30px;text-align:center;padding:18px;line-height:1.4;margin-top:10px}.ok{background:#16b94d;border-radius:20px}.err{background:#e50914;border-radius:20px}button{width:100%;min-height:130px;margin-top:20px;border:0;border-radius:24px;background:#213b58;color:#fff;font-size:34px;font-weight:950}
</style>
</head>
<body>
<div class="wrap"><div class="title">📷 SCANNER QR V20</div><div class="hint">Autorisez la caméra, puis placez le QR code dans le cadre.</div><div class="panel"><div id="reader"></div><div id="status" class="status">Initialisation de la caméra…</div><button onclick="goBack()">↩️ RETOUR</button></div></div>
<script>
let scanner=null,done=false,starting=false;
const params=new URLSearchParams(location.search);
const returnUrl=params.get('return')||'';
function status(t,c){const e=document.getElementById('status');e.textContent=t;e.className='status '+(c||'');}
function goBack(){if(scanner){scanner.stop().catch(()=>{}).finally(()=>{if(returnUrl) location.href=returnUrl; else history.back();});}else if(returnUrl) location.href=returnUrl;else history.back();}
function success(text){if(done)return;done=true;text=String(text||'').trim();status('✅ QR détecté : '+text+' — Retour à l’application…','ok');if(scanner){scanner.stop().catch(()=>{}).finally(()=>redirect(text));}else redirect(text);}
function redirect(text){
  if(window.opener && !window.opener.closed){
    try{window.opener.postMessage({type:'QR_SCAN',qr:String(text||'').trim()},'*');}catch(e){console.warn('postMessage target failed',e);}
    try{window.close();}catch(e){}
    // Certains navigateurs mobiles refusent window.close(). Dans ce cas, le message
    // a déjà été envoyé à l'application ; on laisse le scanner affiché quelques instants.
    setTimeout(()=>{ if(!document.hidden) status('✅ QR envoyé à l’application. Vous pouvez fermer cet onglet.','ok'); }, 700);
    return;
  }
  if(returnUrl){const sep=returnUrl.includes('?')?'&':'?';location.href=returnUrl+sep+'qr='+encodeURIComponent(text);}
}
function fail(e){console.error(e);status('❌ Impossible de démarrer la caméra : '+(e&&e.message?e.message:String(e)),'err');}
async function startWithConstraints(){
  scanner=new Html5Qrcode('reader');
  // Première tentative : demander explicitement la caméra arrière sans sélectionner
  // un périphérique arbitraire. C'est plus fiable sur les téléphones modernes.
  try{
    status('📷 Démarrage de la caméra arrière…');
    await scanner.start({facingMode:{exact:'environment'}},{fps:10,qrbox:{width:280,height:280}},success,()=>{});
    status('📷 Caméra arrière active — présentez le QR code.');
    return true;
  }catch(e1){
    console.warn('facingMode exact failed',e1);
    try{await scanner.stop().catch(()=>{});}catch(_){ }
  }
  // Deuxième tentative : facingMode sans exactitude.
  try{
    status('📷 Recherche d’une caméra compatible…');
    await scanner.start({facingMode:'environment'},{fps:10,qrbox:{width:280,height:280}},success,()=>{});
    status('📷 Caméra active — présentez le QR code.');
    return true;
  }catch(e2){
    console.warn('facingMode environment failed',e2);
    try{await scanner.stop().catch(()=>{});}catch(_){ }
  }
  // Dernier recours : énumération des caméras après autorisation.
  try{
    status('📷 Sélection automatique de la caméra…');
    const cameras=await Html5Qrcode.getCameras();
    if(!cameras||!cameras.length)throw new Error('Aucune caméra détectée');
    let camera=cameras.find(c=>/back|rear|environment|arrière|trasera|后置/i.test(c.label||''))||cameras[cameras.length-1];
    await scanner.start(camera.id,{fps:10,qrbox:{width:280,height:280}},success,()=>{});
    status('📷 Caméra active — présentez le QR code.');
    return true;
  }catch(e3){
    console.error('camera fallback failed',e3);
    throw e3;
  }
}
async function start(){
 if(starting)return; starting=true;
 try{
   if(!window.Html5Qrcode)throw new Error('Lecteur QR indisponible');
   await startWithConstraints();
 }catch(e){fail(e);}
}
start();
</script>
</body></html>
